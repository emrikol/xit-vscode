name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Test on Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # `npm test` globs its test files, which node --test only supports
        # from v21 on, and Node 20 went end-of-life in April 2026. The grammar
        # tests run vscode-oniguruma's WASM build, so more than one runtime is
        # worth covering.
        node: ["22", "24"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - run: npm ci

      # `npm test` builds first, so this covers the TypeScript compile too.
      - run: npm test

  package:
    name: Package
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - run: npm ci

      # Catches manifest problems that the tests cannot see, and confirms
      # nothing unwanted is bundled into the extension.
      - run: npx --yes @vscode/vsce package --no-git-tag-version --out xit.vsix

      - uses: actions/upload-artifact@v4
        with:
          name: xit-vsix
          path: xit.vsix
